server:
  max-http-header-size: 16KB

spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/cartas_contra_humanidade
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true